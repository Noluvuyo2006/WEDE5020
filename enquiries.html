            color: blanchedalmond;
        }
    </style>
    
    <!-- Webpage title -->
    <title> The Love Trust - Enquiries </title>
</head>
<body>

   <header>
        <!-- Navigation menu -->
     <nav>
         <div class="navigation">
         <table width = "100%"> 
            <tr>
                <td align="center" ><a class="active" href="index.html"> Home </a></td>
                <td align="center" ><a href="about_us.html"> About </a></td>
                <td align="center"><a href="services.html"> Services </a></td>

                <td align ="center"><a href="get_involved.html"> Get Involved </a></td>
            </tr>
         </table>
         </div>
     </nav>

        <div class="container">
            <h1 style="color: antiquewhite;"> The Love Trust </h1>
             <!-- Logo -->
             <img src = "images/logo.png" alt = "The Love Trust logo" width="15%" height="100" >
        </div>
    </header>
    <br>

    <main>
        <!-- Enquiry form -->
        <h2 style="color: bisque;"> Enquiry form </h2>
        <form>
            <!-- User's name input -->
            <label> Full Name </label> <br>
            <input type="text" name="fullname"> <br><br>

            <!-- User's email input -->
            <label> Email </label> <br>
            <input type="email" name="email"> <br><br>

            <!-- Dropdown list for type of enquiry -->
            <div class="dropdown">
                <div class="dropbtn">
                    <label> Interested in </label> <br>
                    <select>
                        <option> </option>
                    <div class="dropdown-content">
                        <option> Volunteer </option>
                        <option> Sponsor </option>
                    </div>
                </div>
            </select> 
             </div>
             <br><br>

            <!-- Message textbox -->
            <label> Message </label> <br>
            <textarea name="Message" rows="5" cols="40"></textarea> <br><br>

            <!-- Submit button -->
            <div class="button">
                <button type="submit"> Submit enquiry </button>
            </div>
        </form>
    </main>
